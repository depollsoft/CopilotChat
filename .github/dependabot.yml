version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    allow:
      - dependency-name: "@github/copilot-sdk"
    open-pull-requests-limit: 1
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope
